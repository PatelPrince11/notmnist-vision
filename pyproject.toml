[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notmnist"
version = "0.1.0"
description = "PyTorch notMNIST letter classification: model ladder, evaluation, error analysis"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "pillow",
]

[project.optional-dependencies]
dev = ["pytest"]
api = ["fastapi", "uvicorn", "python-multipart", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
